name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: walletmate-api
        run: uv sync --all-groups --all-extras --all-packages

      - name: Lint
        working-directory: walletmate-api
        run: uv run ruff check .

      - name: Type check
        working-directory: walletmate-api
        run: uv run mypy src/

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        working-directory: walletmate-pwa-app
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: walletmate-pwa-app
        run: bun run lint

      - name: Build
        working-directory: walletmate-pwa-app
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          API_URL: http://localhost:8000
          AUTH_SECRET: ci-auth-secret
          AUTH_URL: http://localhost:3000
          DATABASE_URL: postgresql://walletmate:walletmate@localhost:5432/walletmate
        run: bun run build

  docker:
    name: Docker Images
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: walletmate-api/Dockerfile
          push: false
          load: false

      - name: Build PWA image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: walletmate-pwa-app/Dockerfile
          push: false
          load: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
            API_URL=http://localhost:8000
            AUTH_SECRET=ci-auth-secret
            AUTH_URL=http://localhost:3000
            DATABASE_URL=postgresql://walletmate:walletmate@postgres:5432/walletmate
