name: Prek

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prek:
    name: prek run --all-files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Install frontend dependencies
        working-directory: walletmate-pwa-app
        run: bun install --frozen-lockfile

      - name: Run prek
        uses: j178/prek-action@v2
